# CI pipeline: runs on every push and pull request.
# 1) secret scan  2) SQL lint  3) build the database from migrations  4) run tests
name: KimTay DB CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "sqlfluff==3.*"
      - run: sqlfluff lint migrations tests

  build-and-test:
    name: Build database and run tests
    runs-on: ubuntu-latest
    needs: [secret-scan, lint]
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: kimtay
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: kimtay
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: bash scripts/migrate.sh
      - name: Run migrations again (should skip everything)
        run: bash scripts/migrate.sh
      - name: Run tests
        run: bash scripts/run_tests.sh
